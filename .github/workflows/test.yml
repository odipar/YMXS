# The Java suite, run by hand. It is the whole of what
# this tree checks: doc/tools.md 11 lists the tools it reads.
name: test

# Off by default: no push and no pull request starts it. A caller starts
# it from the Actions tab, or with `gh workflow run test.yml`.
on:
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # ParityTest reads the Go tree against the Java one and skips
      # where go is absent, so a runner without it is green and asleep.
      - run: go version
      # A skipped test is a check that did not run, and a run that skips
      # one is green and asleep. bin/suite (doc/tools.md 11.6) writes what
      # the skipping tests need, runs the suite and ends with 1 where the
      # count is above 0; a caller runs the same script here.
      - name: the suite, and no skip
        run: bin/suite
